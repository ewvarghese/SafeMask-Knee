name: Research toolkit checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: 'Run bundled label-free research training after tests'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies and toolkit
        run: python -m pip install --disable-pip-version-check -r requirements.txt -e .
      - name: Unit and synthetic end-to-end tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONHASHSEED: '20261101'
        run: python -m pytest -q

  label-free-research-run:
    if: github.event_name == 'workflow_dispatch' && inputs.run_training == true
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify bundled archive and fit grouped acceptance/IPCW
        run: bash scripts/run_release.sh
      - name: Make safe aggregate-only run summary
        run: |
          .venv/bin/python scripts/summarize_ci.py --root outputs --out outputs/ci/public_summary.json
          cat outputs/ci/job_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: safe-aggregate-research-summary
          path: outputs/ci/public_summary.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

# No competition CSV, expert answer key, study-level prediction, weights,
# clinical mask or full raw report is uploaded as an artifact or committed.
